# Servidor de pruebas del Registro de Visitas.
# Se corre con: ansible-playbook provisionar.yml
- name: Servidor de pruebas - Registro de Visitas
  hosts: localhost
  connection: local
  become: true
 
  tasks:
    - name: Existe el usuario de sistema registro
      ansible.builtin.user:
        name: registro
        system: true
        create_home: false
 
    - name: Existe la carpeta de la aplicación
      ansible.builtin.file:
        path: /opt/registro
        state: directory
        owner: registro
        group: registro
 
    - name: El aviso aparece al abrir la terminal
      become: false
      ansible.builtin.lineinfile:
        path: "{{ lookup('env', 'HOME') }}/.bashrc"
        line: 'echo "*** SERVIDOR DE PRUEBAS - Registro de Visitas ***"'

    - name: Esta instalado sqlite3
      become: true
      ansible.builtin.apt:
        name: sqlite3
        
        update_cache: true
        cache_valid_time: 3600

    - name: Existe el archivo de la aplicación
      become: true
      ansible.builtin.copy:
        src: app.py
        dest: /opt/registro/app.py
        owner: registro
        group: registro
        mode: '0644'

    - name: Existe el archivo de entorno
      become: true
      ansible.builtin.copy:
        content: | 
          # Archivo de entorno para la aplicación Registro de Visitas
          # Se puede modificar para cambiar la configuración de la aplicación
          # Variables de entorno:
          #   - DB_PATH: Ruta del archivo de base de datos SQLite
          #   - PORT: Puerto en el que se ejecuta la aplicación
          DB_PATH=/opt/registro/registro.db
          PORT=5000
        dest: /opt/registro/registro.env
        owner: registro
        group: registro
        mode: '0644'



        



      
